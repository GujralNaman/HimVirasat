  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Discover HimVirasat, a regional food brand inspired by Jammu and the Himalayas. Explore the culinary heritage of Rajma, rice, saffron, walnuts, honey and more." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HimVirasat" />
    <meta property="og:title" content="HimVirasat | The Heritage of the Himalayas" />
    <meta property="og:description" content="Discover HimVirasat, a regional food brand inspired by Jammu and the Himalayas. Explore the culinary heritage of Rajma, rice, saffron, walnuts, honey and more." />
    <meta property="og:image" content="/og-image.svg" />

    <link rel="icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // GitHub Pages SPA support: restore intended path from sessionStorage
      // so React Router renders the correct route after a 404.html redirect
      (function () {
        var savedPath = sessionStorage.getItem('github-pages-redirect-path');
        if (savedPath) {
          sessionStorage.removeItem('github-pages-redirect-path');
          window.history.replaceState(null, null, savedPath);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
