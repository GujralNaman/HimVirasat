<!DOCTYPE html>
<html>
<head>
  <title>HimVirasat</title>
  <script type="text/javascript">
    // GitHub Pages SPA fallback: save intended path, then load index.html
    // React Router will read sessionStorage and render the correct route
    sessionStorage.setItem('github-pages-redirect-path', window.location.pathname + window.location.search + window.location.hash);
    window.location.href = '/index.html';
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
